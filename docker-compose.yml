services:
  db:
    image: postgres:16
    container_name: uwb-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: uwb_rtls
      POSTGRES_USER: uwb
      POSTGRES_PASSWORD: uwb_demo_password
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - uwb_postgres_data:/var/lib/postgresql/data

volumes:
  uwb_postgres_data:
