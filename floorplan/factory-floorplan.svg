<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="1000" viewBox="0 0 1000 1000">
  <rect width="1000" height="1000" fill="#eef1f4"/>
  <rect x="35" y="35" width="930" height="930" fill="#ffffff" stroke="#17202a" stroke-width="8"/>

  <!-- Production area -->
  <rect x="100" y="100" width="350" height="300" fill="#eaf3ff" stroke="#6b8fb3" stroke-width="4"/>
  <text x="275" y="250" text-anchor="middle" font-family="Arial" font-size="32" fill="#3d566e">
    PRODUCTION
  </text>

  <!-- Storage -->
  <rect x="100" y="500" width="350" height="300" fill="#f4f0ff" stroke="#8b7bb5" stroke-width="4"/>
  <text x="275" y="650" text-anchor="middle" font-family="Arial" font-size="32" fill="#5f5281">
    STORAGE
  </text>

  <!-- Office -->
  <rect x="550" y="100" width="300" height="220" fill="#eff9f0" stroke="#77a37b" stroke-width="4"/>
  <text x="700" y="215" text-anchor="middle" font-family="Arial" font-size="30" fill="#4b6e4e">
    OFFICE
  </text>

  <!-- Restricted -->
  <rect x="600" y="600" width="300" height="300" fill="#ffeaea" stroke="#e74c3c" stroke-width="6"/>
  <text x="750" y="745" text-anchor="middle" font-family="Arial" font-size="30" fill="#a63b32">
    RESTRICTED
  </text>

  <!-- Central corridor -->
  <rect x="450" y="400" width="150" height="160" fill="#f7f7f7" stroke="#999" stroke-width="3"/>
  <text x="525" y="485" text-anchor="middle" font-family="Arial" font-size="20" fill="#777"
        transform="rotate(90 525 485)">
    CORRIDOR
  </text>

  <!-- Doors -->
  <line x1="450" y1="400" x2="450" y2="455" stroke="#ffffff" stroke-width="12"/>
  <line x1="600" y1="560" x2="600" y2="615" stroke="#ffffff" stroke-width="12"/>

  <!-- Scale -->
  <line x1="80" y1="925" x2="180" y2="925" stroke="#17202a" stroke-width="5"/>
  <text x="130" y="955" text-anchor="middle" font-family="Arial" font-size="22">1 m</text>

  <text x="500" y="55" text-anchor="middle" font-family="Arial" font-size="28" font-weight="bold">
    SAMPLE FACTORY FLOOR PLAN
  </text>
</svg>
