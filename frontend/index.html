<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>UWB Indoor Localization</title>

    <link
        rel="stylesheet"
        href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
    />

    <style>
        html, body {
            height: 100%;
            margin: 0;
        }

        #map {
            width: 100%;
            height: 100%;
        }

        #status {
            position: absolute;
            top: 10px;
            left: 60px;
            z-index: 1000;

            background: white;
            padding: 10px 15px;
            border-radius: 6px;

            font-family: Arial;
            font-size: 14px;

            box-shadow: 0 2px 6px rgba(0,0,0,0.3);
        }
    </style>
</head>

<body>

<div id="status">
    Connecting to backend...
</div>

<div id="map"></div>


<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>


<script>

    // ==========================================
    // 1. CREATE MAP
    // ==========================================

    const map = L.map("map", {
        crs: L.CRS.Simple,
        minZoom: -2,
        maxZoom: 3
    });

    const bounds = [
        [0, 0],
        [10, 10]
    ];

    L.imageOverlay(
        "floorplan.svg",
        bounds
    ).addTo(map);

    map.fitBounds(bounds);


    // ==========================================
    // 2. STORE TAG MARKERS
    // ==========================================

    const tagMarkers = {};


    // ==========================================
    // 3. GET DATA FROM BACKEND
    // ==========================================

    async function updatePositions() {

        try {

            const response = await fetch(
                "http://127.0.0.1:8000/api/positions/latest"
            );

            console.log("HTTP status:", response.status);

            const data = await response.json();

            console.log("Received from backend:", data);

            // Update status
            document.getElementById("status").innerHTML =
                "Backend connected ✓ | " +
                data.length +
                " tags received";


            // ==================================
            // 4. PROCESS EACH TAG
            // ==================================

            data.forEach(tag => {

                const x = tag.x;
                const y = tag.y;

                // Convert normal X/Y coordinates
                // into Leaflet coordinates.
                const mapY = 10 - y;


                // If marker doesn't exist, create it
                if (!tagMarkers[tag.tag_id]) {

                    tagMarkers[tag.tag_id] =
                        L.marker([mapY, x])
                        .addTo(map);

                }

                // Move marker
                tagMarkers[tag.tag_id].setLatLng([
                    mapY,
                    x
                ]);


                // Update popup
                tagMarkers[tag.tag_id].bindPopup(

                    "<b>" + tag.tag_id + "</b><br>" +

                    "Name: " + tag.name + "<br>" +

                    "Type: " + tag.tag_type + "<br>" +

                    "X: " + x.toFixed(2) + " m<br>" +

                    "Y: " + y.toFixed(2) + " m<br>" +

                    "Z: " + tag.z.toFixed(2) + " m<br>" +

                    "Accuracy: " +
                    tag.accuracy.toFixed(3) +
                    " m<br>" +

                    "Source: " + tag.source

                );

            });

        }

        catch (error) {

            console.error(
                "Backend connection error:",
                error
            );

            document.getElementById("status").innerHTML =
                "❌ Cannot connect to backend";
        }
    }


    // ==========================================
    // 5. START
    // ==========================================

    updatePositions();

    setInterval(
        updatePositions,
        1000
    );

</script>

</body>
</html>
